name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: active_record-framing-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3']
        gemfile:
          - gemfiles/activerecord-5.2.Gemfile
          - gemfiles/activerecord-6.0.Gemfile
          - gemfiles/activerecord-6.1.Gemfile
          - gemfiles/activerecord-7.0.Gemfile
          - gemfiles/activerecord-7.1.Gemfile
          - gemfiles/activerecord-7.2.Gemfile
        postgres: ['15', '17']
        exclude:
          # Rails 5.2 requires Ruby < 3.1
          - ruby: '3.1'
            gemfile: gemfiles/activerecord-5.2.Gemfile
          - ruby: '3.2'
            gemfile: gemfiles/activerecord-5.2.Gemfile
          - ruby: '3.3'
            gemfile: gemfiles/activerecord-5.2.Gemfile
          # Rails 6.0 requires Ruby < 3.1
          - ruby: '3.1'
            gemfile: gemfiles/activerecord-6.0.Gemfile
          - ruby: '3.2'
            gemfile: gemfiles/activerecord-6.0.Gemfile
          - ruby: '3.3'
            gemfile: gemfiles/activerecord-6.0.Gemfile
          # Reduce PG matrix — only test PG 17 for most combos
          - postgres: '15'
        include:
          # Ensure PG 15 coverage on latest Rails
          - ruby: '3.3'
            gemfile: gemfiles/activerecord-7.1.Gemfile
            postgres: '15'
          - ruby: '3.2'
            gemfile: gemfiles/activerecord-7.0.Gemfile
            postgres: '15'

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/active_record-framing-test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec --format documentation
