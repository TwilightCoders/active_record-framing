name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rails 7.2
          - { ruby: '3.3', gemfile: 'gemfiles/activerecord-7.2.Gemfile', postgres: '17' }
          - { ruby: '3.1', gemfile: 'gemfiles/activerecord-7.2.Gemfile', postgres: '15' }
          # Rails 7.1
          - { ruby: '3.3', gemfile: 'gemfiles/activerecord-7.1.Gemfile', postgres: '17' }
          - { ruby: '3.0', gemfile: 'gemfiles/activerecord-7.1.Gemfile', postgres: '15' }
          # Rails 7.0
          - { ruby: '3.2', gemfile: 'gemfiles/activerecord-7.0.Gemfile', postgres: '17' }
          - { ruby: '3.0', gemfile: 'gemfiles/activerecord-7.0.Gemfile', postgres: '15' }
          # Rails 6.1
          - { ruby: '3.0', gemfile: 'gemfiles/activerecord-6.1.Gemfile', postgres: '15' }
          # Rails 6.0
          - { ruby: '2.7', gemfile: 'gemfiles/activerecord-6.0.Gemfile', postgres: '15' }
          # Rails 5.2
          - { ruby: '2.7', gemfile: 'gemfiles/activerecord-5.2.Gemfile', postgres: '15' }

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: active_record-framing-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/active_record-framing-test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec --format documentation
